
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadGen Pro & SEO Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Immediate polyfill for browser environments to prevent crashes on 'process' access
      (function() {
        window.process = window.process || { env: { API_KEY: '' } };
        
        // Log global errors to help debug blank screens in production
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          console.error('Frontend Error:', msg, 'at', url, 'line', lineNo);
          return false;
        };
      })();
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        /* Custom scrollbar for better UX */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Visual cue to prevent "white screen" confusion during initialization */
        #root:empty::before {
            content: 'Initializing LeadGen Pro...';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #64748b;
            font-weight: 600;
            font-size: 1.125rem;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
<script type="importmap">

  }
}
</script>

    <div id="root"></div>
